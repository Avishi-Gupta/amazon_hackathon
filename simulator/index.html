<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>HomeStock · Alexa+ Simulator</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="6" width="26" height="21" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M3 13h26M12 13v14M12 20h17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="7.5" cy="9.5" r="1.3" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <h1>HomeStock</h1>
        <p class="tagline">Knows what's in your home, what's going off, and what you're about to run out of</p>
      </div>
    </div>
    <p id="connection" class="status-pill" data-state="connecting">Connecting…</p>
  </header>

  <main class="stage">
    <div class="device" aria-label="Simulated Echo Show">
      <section id="screen" class="screen">
        <div id="idle" class="idle">
          <p id="clock" class="clock"></p>
          <p class="hint">Try saying…</p>
          <div class="chips">
            <button class="chip" data-say="What should I use up?">“What should I use up?”</button>
            <button class="chip" data-say="What's running low this week?">“What's running low?”</button>
            <button class="chip" data-say="I just bought a dozen eggs, two cartons of milk and some spinach">“I bought eggs, milk and spinach”</button>
            <button class="chip" data-say="Show me my shopping list">“Show my shopping list”</button>
          </div>
        </div>
      </section>
      <div id="light-bar" class="light-bar" data-state="idle" aria-hidden="true"></div>
      <p class="device-caption">Echo Show · simulated</p>
    </div>

    <aside class="assistant" aria-label="Conversation">
      <header class="panel-head">
        <h2>Conversation</h2>
        <p class="subtitle">Speak or type, as you would to Alexa</p>
      </header>
      <ol id="transcript" class="transcript" aria-live="polite"></ol>
      <form id="ask" class="ask">
        <button id="mic" class="mic" type="button" aria-label="Speak">🎙️</button>
        <button id="camera" class="mic" type="button" aria-label="Scan a receipt or your groceries">📷</button>
        <input id="photo-input" type="file" accept="image/*" hidden>
        <input id="utterance" autocomplete="off" placeholder="Type what you'd say to Alexa…" aria-label="Utterance">
        <button type="submit">Send</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </aside>
  </main>
  <script type="module" src="./src/host.ts"></script>
</body>
</html>
